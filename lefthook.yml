commit-msg:
  jobs:
    - name: conventional commits
      run: pnpm exec commitlint --edit {1}
    - name: no AI attribution
      run: "! grep -qiE 'co-authored-by:.*(claude|anthropic|openai|copilot|cursor|gemini)|generated with|claude-session:' {1}"
pre-push:
  jobs:
    - name: pnpm verify, or pnpm verify --docs on a markdown-only push
      run: if node scripts/change-kind.ts origin/main...HEAD | grep -qx 'kind=docs'; then pnpm verify --docs; else pnpm verify; fi
