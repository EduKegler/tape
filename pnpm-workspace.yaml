packages:
  - packages/*

allowBuilds:
  # Downloads the posthog-cli binary that uploads source maps.
  '@posthog/cli': true
  esbuild: true
  lightningcss: true

overrides:
  # The WalletConnect QR modal. Tape draws its own QR, see src/wallet/no-appkit.ts.
  '@reown/appkit': '-'
  # @dydxprotocol/v4-client-js pins axios 1.1.3 and @osmonauts/lcd pins 0.27.2, both with open GitHub advisories.
  'axios@<1.21.0': 1.21.0

# npm lets an author unpublish a version during its first 72 hours.
minimumReleaseAge: 4320
