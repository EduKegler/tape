name: Feature request
description: Something Tape should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Tape could do about it. Link the venue's docs if the feature depends on a venue.
  - type: dropdown
    id: venue
    attributes:
      label: Venue
      options:
        - Binance
        - Hyperliquid
        - dYdX
        - Orderly
        - A new venue
        - All, or none
