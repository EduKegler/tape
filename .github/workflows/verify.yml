name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: what kind of files the change touches
        if: github.event_name == 'push'
        id: changes
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: node scripts/change-kind.ts "$RANGE"
      - run: pnpm install --frozen-lockfile
      - name: trees verified by earlier runs of the pull request
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .git/tape-verified-trees
          key: verified-trees-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: verified-trees-
      - name: pnpm verify on each commit of the pull request and its merge
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: pnpm verify:commits "origin/$BASE"
      - name: keep the trees this run verified
        if: always() && github.event_name == 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: .git/tape-verified-trees
          key: verified-trees-${{ github.run_id }}-${{ github.run_attempt }}
      - name: the markdown checks of pnpm verify
        if: github.event_name == 'push' && steps.changes.outputs.kind == 'docs'
        run: pnpm verify --docs
      - name: pnpm verify
        if: github.event_name == 'push' && steps.changes.outputs.kind != 'docs'
        run: pnpm verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: what kind of files the change touches
        id: changes
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/change-kind.ts "$RANGE"
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm e2e
      - name: traces and screenshots of the failed journeys
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/results

  deploy:
    if: github.event_name == 'push'
    needs: [verify, e2e]
    strategy:
      fail-fast: false
      matrix:
        network: [mainnet, testnet]
    uses: ./.github/workflows/deploy.yml
    with:
      network: ${{ matrix.network }}
      range: ${{ github.event.before }}..${{ github.sha }}
    secrets: inherit
