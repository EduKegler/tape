name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm verify on each commit of the pull request and its merge
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: pnpm verify:commits "origin/$BASE"
      - name: pnpm verify
        if: github.event_name == 'push'
        run: pnpm verify
