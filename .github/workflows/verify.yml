name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: what kind of files the change touches
        id: changes
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/change-kind.ts "$RANGE"
      - run: pnpm install --frozen-lockfile
      - name: the markdown checks of pnpm verify
        if: steps.changes.outputs.kind == 'docs'
        run: pnpm verify --docs
      - name: pnpm verify
        if: steps.changes.outputs.kind != 'docs'
        run: pnpm verify

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: what kind of files the change touches
        id: changes
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/change-kind.ts "$RANGE"
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        env:
          SHARD: ${{ matrix.shard }}/3
        run: pnpm e2e --shard="$SHARD"
      - name: traces and screenshots of the failed journeys
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: e2e/results

  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "shards $SHARDS"
          [ "$SHARDS" = success ]

  deploy:
    if: github.event_name == 'push'
    needs: [verify, e2e]
    strategy:
      fail-fast: false
      matrix:
        network: [mainnet, testnet]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      deployments: read
    with:
      network: ${{ matrix.network }}
    secrets: inherit
