name: deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: The site to build again from main with its environment's variables
        type: choice
        options: [testnet, mainnet]
        required: true
  workflow_call:
    inputs:
      network:
        type: string
        required: true
      range:
        description: The pushed commits. A range of only docs or tests deploys nothing.
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    concurrency: deploy-${{ inputs.network }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: what kind of files the change touches
        if: inputs.range != ''
        id: changes
        env:
          RANGE: ${{ inputs.range }}
        run: node scripts/change-kind.ts "$RANGE"
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm install --frozen-lockfile
      - name: the build variables of the network's environment
        if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        env:
          VARS: ${{ toJSON(vars) }}
          NETWORK: ${{ inputs.network }}
        run: |
          jq -r 'to_entries[] | select(.key | startswith("VITE_")) | "\(.key)<<VITE_VALUE\n\(.value)\nVITE_VALUE"' <<< "$VARS" >> "$GITHUB_ENV"
          echo "VITE_NETWORK=$NETWORK" >> "$GITHUB_ENV"
      - if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        run: pnpm build
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      - name: main still points at this commit
        if: steps.changes.outputs.kind != 'docs' && steps.changes.outputs.kind != 'tests'
        id: head
        run: |
          built="$(git rev-parse HEAD)"
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$built" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past $built, so its run deploys instead."
          fi
      - if: steps.head.outputs.latest == 'true'
        run: pnpm exec wrangler deploy -c .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
