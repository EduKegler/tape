name: deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: The site to build again from main with its environment's variables
        type: choice
        options: [testnet, mainnet]
        required: true
  workflow_call:
    inputs:
      network:
        type: string
        required: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: main still points at this commit
        if: github.event_name != 'workflow_dispatch'
        id: head
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved past $GITHUB_SHA, so its run deploys instead."
          fi
      - name: the commit the network last deployed
        if: steps.head.outputs.latest == 'true'
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: ${{ inputs.network }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$NETWORK&per_page=100" --jq '.[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')" = success ]; then
              echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)" >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - name: what kind of files changed since then
        if: steps.head.outputs.latest == 'true'
        id: changes
        env:
          RANGE: ${{ steps.last.outputs.sha }}..${{ github.sha }}
        run: node scripts/change-kind.ts "$RANGE"
      - name: decide
        id: decide
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          KIND: ${{ steps.changes.outputs.kind }}
        run: |
          if [ "$DISPATCHED" = true ] || { [ -n "$KIND" ] && [ "$KIND" != docs ] && [ "$KIND" != tests ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.network }}
    concurrency:
      group: deploy-${{ inputs.network }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the build variables of the network's environment
        env:
          VARS: ${{ toJSON(vars) }}
          NETWORK: ${{ inputs.network }}
        run: |
          jq -r 'to_entries[] | select(.key | startswith("VITE_")) | "\(.key)<<VITE_VALUE\n\(.value)\nVITE_VALUE"' <<< "$VARS" >> "$GITHUB_ENV"
          echo "VITE_NETWORK=$NETWORK" >> "$GITHUB_ENV"
      - run: pnpm build
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      - run: pnpm exec wrangler deploy -c .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
